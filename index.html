<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
  <title>Feedback Form</title>
</head>
<body>

<form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DdL00000M6PlW" method="POST">

  <input type="hidden" name="orgid" value="00DdL00000M6PlW">
  <input type="hidden" name="retURL" value="https://">

  <label for="name">Contact Name</label>
  <input id="name" maxlength="80" name="name" size="20" type="text" /><br>

  <label for="email">Email</label>
  <input id="email" maxlength="80" name="email" size="20" type="text" /><br>

  <label for="phone">Phone</label>
  <input id="phone" maxlength="40" name="phone" size="20" type="text" /><br>

  <label for="subject">Subject</label>
  <input id="subject" maxlength="80" name="subject" size="20" type="text" /><br>

  <label for="description">Description</label>
  <textarea id="description" name="description"></textarea><br>

  <!-- Custom field: Booking__c -->
  <input type="hidden" name="00NdL00000cHJqp" value="" />

  <input type="submit" name="submit" value="Submit Feedback">

</form>

<script>
  window.addEventListener('DOMContentLoaded', function () {
    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('bookingId');
    if (bookingId) {
      document.querySelector('input[name="00NdL00000cHJqp"]').value = bookingId;
    }
  });
</script>

</body>
</html>
